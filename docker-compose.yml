version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: keenpay_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-keenpay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-keenpay_secure_password}
      POSTGRES_DB: ${DB_NAME:-keenpay_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/SCHEMA.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-keenpay}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keenpay_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: keenpay_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keenpay_network

  # KeenPay FastAPI Application
  keenpay_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keenpay_api
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Database Configuration
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-keenpay}:${DB_PASSWORD:-keenpay_secure_password}@postgres:5432/${DB_NAME:-keenpay_db}

      # Redis Configuration
      REDIS_URL: redis://redis:6379/0

      # Application Configuration
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Razorpay Configuration (Add your keys in .env)
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}

      # OpenAI Configuration (Add your key in .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_ALGORITHM: HS256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
    networks:
      - keenpay_network
    restart: unless-stopped

  # Optional: Adminer for Database Management UI
  adminer:
    image: adminer:latest
    container_name: keenpay_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - keenpay_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  keenpay_network:
    driver: bridge
