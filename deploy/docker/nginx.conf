# Optional reverse proxy for single-host deployments (Railway, Fly, VPS).
# Not required for local dev.

upstream api {
    server api:8000;
}

upstream web {
    server web:3000;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /webhooks/ {
        proxy_pass http://api;
    }

    location / {
        proxy_pass http://web;
    }
}
