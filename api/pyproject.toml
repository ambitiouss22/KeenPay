[project]
name = "keenpay-api"
version = "0.1.0"
description = "KeenPay FastAPI + LangGraph backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-openai>=0.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    # Pinned, not floating. An unpinned ruff picks up new rules on release
    # day and turns CI red with no code change. Bump deliberately.
    "ruff==0.16.5",
    "httpx>=0.28.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
# ".." puts the repo root on sys.path so tests can do `from api.main import app`;
# "." puts api/ on it so main.py's bare imports (`from config.logging import ...`) resolve.
pythonpath = ["..", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "security: security-focused tests",
    "integration: integration tests requiring services",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "routers/dev.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# UP042: `class X(str, Enum)` -> StrEnum. Deliberate: the str-mixin form keeps
# JSON serialisation behaviour we rely on across the API boundary.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Asserts ARE the test. Env vars must be set before the app import in conftest.
"tests/**" = ["S101", "S105", "S106", "E402", "F841"]
# Asserts here narrow Optional[Session] for the type checker, not runtime checks.
"repositories/**" = ["S101"]
"services/session.py" = ["S101"]
# Field defaults on a Settings model, not real credentials.
"config/settings.py" = ["S104", "S105"]
"core/jwt.py" = ["S105"]
"schemas/auth.py" = ["S105"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is designed around calls in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header",
    "fastapi.Path", "fastapi.Body", "fastapi.Form",
]

[tool.bandit]
exclude_dirs = ["tests"]
