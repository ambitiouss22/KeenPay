name: PR Gate

# No `paths:` filter on purpose. A required check that is skipped by a path
# filter never reports, and the PR sits on "Expected — waiting for status"
# forever. This one always runs, so it can safely be a required check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        working-directory: api
        run: pip install -e ".[dev]"

      # No separate "app boots" step. tests/conftest.py does
      # `from api.main import app` at module scope, so if these tests run at
      # all, the whole app imported cleanly. pytest resolves that through
      # `pythonpath = ["..", "."]` in api/pyproject.toml — a hand-rolled
      # PYTHONPATH here does NOT reproduce it and fails on `from routers ...`.
      - name: Engine unit tests
        working-directory: api
        env:
          JWT_SECRET: ci-secret-key-minimum-32-chars-long
          RAZORPAY_MOCK: "true"
          ENABLE_DEV_ROUTES: "true"
          USE_IN_MEMORY_STORE: "true"
        run: >
          pytest tests/test_risk_engine.py
          tests/test_authorization_engine.py
          tests/test_transaction_passport.py -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to the version used locally. An unpinned `pip install ruff`
      # picks up new rules on release day and turns the gate red on its own.
      - run: pip install ruff==0.16.5
      - name: Ruff
        working-directory: api
        run: ruff check .
