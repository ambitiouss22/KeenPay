name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "bandit[toml]"
      # -ll = fail on MEDIUM and HIGH only. The LOW findings are B101 (asserts
      # used for type-narrowing) and B105 (token-type strings like "bearer"),
      # the same false positives already justified in api/pyproject.toml's ruff
      # config. Real medium/high findings still fail the build.
      - run: bandit -r api -c api/pyproject.toml -ll

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r <(pip install api/. 2>/dev/null; pip freeze) || pip-audit --requirement api/pyproject.toml || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed secrets patterns
        run: |
          ! grep -rE "(sk_live_|rzp_live_|OPENAI_API_KEY=sk-)" --include="*.env" --include="*.py" --include="*.ts" . || exit 1
